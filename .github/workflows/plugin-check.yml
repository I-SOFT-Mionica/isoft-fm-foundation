name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via wp-env directly — bypasses the wordpress/plugin-check-action wrapper
# because it hardcodes "core": null in its generated .wp-env.json and
# exposes no phpVersion input.
#
# Key insight from the latest reviewer iteration: Plugin Check can run
# against an INACTIVE plugin (no `wp plugin activate` call needed). That
# sidesteps the PHP 8.4 activation barrier — wp-env can boot with the
# default PHP 8.3 image and we still get the static check coverage.
#
# Plugin installed via .wp-env.json `mappings` (not `plugins`) so wp-env
# mounts our source straight into wp-content/plugins/isoft-fm-foundation/
# without a copy step.
#
# continue-on-error remains because the wp-env 11.7.0 `docker compose
# build` regression may still bite us — log signature
# `wordpress Skipped - No image to be pulled` then only MySQL comes up.
# If this run goes green the flag can be dropped in a follow-up.
#
# Custom hand-rolled-with-docker-cp workflow still preserved on branch
# `backup/pre-plugin-check-action-revival` if both approaches fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # see header comment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install wp-env
        run: npm install -g @wordpress/env

      - name: Generate .wp-env.json
        # "core": "latest" (explicit string) instead of null — the action's
        # hardcoded null has caused wp-env to skip the WordPress build.
        # Plugin source mounted via mappings so it appears at
        # wp-content/plugins/isoft-fm-foundation/ inside the container.
        # plugin-check itself is installed via the plugins array.
        run: |
          cat > .wp-env.json <<EOF
          {
            "core": "latest",
            "plugins": [
              "https://downloads.wordpress.org/plugin/plugin-check.zip"
            ],
            "mappings": {
              "wp-content/plugins/isoft-fm-foundation": "${GITHUB_WORKSPACE}"
            }
          }
          EOF
          cat .wp-env.json

      - name: Start wp-env
        run: wp-env start --update

      - name: Verify plugin is mounted
        # No `wp plugin activate` call — Plugin Check works on inactive
        # plugins, which lets us run without forcing PHP 8.4.
        run: |
          wp-env run cli wp plugin list

      - name: Run Plugin Check
        run: |
          wp-env run cli wp plugin check isoft-fm-foundation \
            --format=table \
            --categories=general,plugin_repo,security,performance,accessibility \
            --include-experimental \
            --exclude-directories=vendor,node_modules,tests,languages \
            --require=./wp-content/plugins/plugin-check/cli.php

      - name: Stop wp-env
        if: always()
        run: wp-env stop || true
