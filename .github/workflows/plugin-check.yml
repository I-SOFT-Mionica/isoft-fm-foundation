name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via the WordPress team's maintained action.
#
# ⚠ ADVISORY ONLY (continue-on-error: true). As of late May 2026, wp-env 11.7.0
# has a regression where 'wp-env start' generates docker-compose 'build:'
# directives for the WordPress service but never invokes 'docker compose build'.
# The log signature is 'wordpress Skipped - No image to be pulled' followed by
# only MySQL containers coming up. Both the official action AND our previous
# hand-rolled workflow hit this — wp-env is broken for everyone.
#
# We keep the workflow running so we'll see it go green automatically when
# upstream fixes itself, but failures don't block the merge gate. Plugin Check
# is validated locally (Local Sites + plugin-check plugin) before tagging a
# release.
#
# Custom workflow preserved on branch `backup/pre-plugin-check-action-revival`
# in case we want to revive a non-wp-env approach (docker-compose with
# wordpress:php8.4-apache directly).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # see header comment

    steps:
      - uses: actions/checkout@v4

      - name: Run Plugin Check
        # Pinned to a specific release rather than @v1 so an upstream
        # regression can't silently change our gate.
        uses: wordpress/plugin-check-action@v1.1.6
        with:
          build-dir: ${{ github.workspace }}
          slug: isoft-fm-foundation
          php-version: '8.4'
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          include-experimental: true
          exclude-directories: |
            vendor
            node_modules
            tests
            languages
