name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via the WordPress team's maintained action — the same tool the WP.org
# plugin-review team runs against submissions.
#
# History: we previously hand-rolled this workflow (install wp-env globally,
# drive wp-env start ourselves, docker cp the plugin into the container, run
# wp plugin check) to bypass a wrapper bug. After WordPress 7, Plugin Check
# 2.0, and the wp-env 11.7.0 regression all landed in late May 2026, the
# upstream action (v1.1.6) is in a much better position than us to keep up
# with those upstream changes. The custom workflow is preserved on the
# branch `backup/pre-plugin-check-action-revival` for easy revival.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Plugin Check
        # Pinned to a specific release rather than @v1 so an upstream
        # regression can't silently change our gate.
        uses: wordpress/plugin-check-action@v1.1.6
        with:
          build-dir: ${{ github.workspace }}
          slug: isoft-fm-foundation
          php-version: '8.4'
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          include-experimental: true
          exclude-directories: |
            vendor
            node_modules
            tests
            languages
