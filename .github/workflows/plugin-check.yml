name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via the WordPress team's maintained action.
#
# Pre-creating .wp-env.json with our own config is load-bearing:
# the action auto-generates one with `"core": null` (and no phpVersion)
# when none exists, which has caused wp-env to skip the WordPress
# container build in our environment. With WP_ENV_JSON_EXISTS=true the
# action respects our config.
#
# `php-version` is NOT a valid input on the action — PHP version is
# controlled exclusively through .wp-env.json's phpVersion field.
#
# continue-on-error stays for one cycle as a safety net while we verify
# the fix; remove once the inner job is consistently green.
#
# Custom (non-action) workflow preserved on branch
# `backup/pre-plugin-check-action-revival` for revival if needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # see header comment — remove once stable

    steps:
      - uses: actions/checkout@v4

      - name: Pre-create .wp-env.json
        # Forces the action's WP_ENV_JSON_EXISTS=true branch; our config
        # is used instead of the action generating one with "core": null.
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "phpVersion": "8.4",
            "testsEnvironment": false,
            "plugins": [
              "https://downloads.wordpress.org/plugin/plugin-check.zip"
            ]
          }
          EOF
          cat .wp-env.json

      - name: Run Plugin Check
        # Pinned to a specific release rather than @v1 so an upstream
        # regression can't silently change our gate.
        uses: wordpress/plugin-check-action@v1.1.6
        with:
          build-dir: ${{ github.workspace }}
          slug: isoft-fm-foundation
          wp-version: latest
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          include-experimental: true
          exclude-directories: |
            vendor
            node_modules
            tests
            languages
