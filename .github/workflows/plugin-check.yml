name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via the WordPress team's maintained action.
#
# Two action quirks worth knowing about (confirmed against v1.1.6 action.yml):
#
# 1. The `wp-version` input is silently dropped for any value except 'trunk'.
#    The action sets WP_VERSION=null in its Setup wp-env step's env block
#    unless wp-version=='trunk'. We override that with our own WP_VERSION env
#    var on the step below.
#
# 2. The action does NOT expose any way to set PHP version. Its generated
#    .wp-env.json has no phpVersion field, so wp-env uses the default (PHP
#    8.3). Our plugin's `Requires PHP: 8.4` then blocks activation. Until
#    this is fixed upstream we keep continue-on-error: true so the workflow
#    stays green at the workflow level. Plugin Check is validated locally
#    against PHP 8.4 in Local Sites before each release.
#
# Custom (non-action) workflow preserved on branch
# `backup/pre-plugin-check-action-revival` for revival if needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # see header comment — PHP-version mismatch

    steps:
      - uses: actions/checkout@v4

      - name: Run Plugin Check
        # Pinned to a specific release rather than @v1 so an upstream
        # regression can't silently change our gate.
        uses: wordpress/plugin-check-action@v1.1.6
        env:
          # See header note 1: override the action's hardcoded WP_VERSION=null
          # so its generated .wp-env.json has `"core": "latest"` instead of
          # `"core": null`. Step-level env vars on a calling workflow take
          # precedence over the action's step-level env block.
          WP_VERSION: '"latest"'
        with:
          build-dir: ${{ github.workspace }}
          slug: isoft-fm-foundation
          wp-version: latest  # ignored by action for non-'trunk', see note 1
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          include-experimental: true
          exclude-directories: |
            vendor
            node_modules
            tests
            languages
