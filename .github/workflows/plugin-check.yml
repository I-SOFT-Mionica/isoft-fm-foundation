name: Plugin Check

# Runs the official WordPress Plugin Check (https://wordpress.org/plugins/plugin-check/)
# via the WordPress team's maintained action.
#
# ADVISORY ONLY (continue-on-error: true). Investigation findings against
# wordpress/plugin-check-action@v1.1.6 action.yml — three upstream barriers
# that together prevent the inner job from going green:
#
# 1. wp-env 11.7.0 generates docker-compose `build:` directives for the
#    WordPress service but never invokes `docker compose build`. Log
#    signature: `wordpress Skipped - No image to be pulled` followed by
#    only the MySQL containers coming up.
#
# 2. The action's `wp-version` input is silently dropped for any value
#    except 'trunk'. Action's Setup wp-env step:
#      env:
#        WP_VERSION: ${{ inputs.wp-version == 'trunk' && '...' || 'null' }}
#    Tried overriding via the calling step's `env: WP_VERSION: latest` —
#    step-level env inside the action wins over the caller's step env.
#    Tried pre-creating .wp-env.json — the action unconditionally
#    truncates and rewrites it (touch + > + echo).
#
# 3. The action exposes no way to set PHP version. Its generated
#    .wp-env.json has no phpVersion field, so wp-env defaults to PHP
#    8.3, and our `Requires PHP: 8.4` then blocks `wp plugin activate`.
#
# Net: we cannot fix this from the caller side without forking the
# action. Plugin Check is validated locally against PHP 8.4 in Local
# Sites before each release. When upstream fixes any of these (notably
# (1) — the wp-env regression), the workflow will start going green on
# its own and we can drop continue-on-error.
#
# Custom (non-action) workflow preserved on branch
# `backup/pre-plugin-check-action-revival` for revival if needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # see header comment

    steps:
      - uses: actions/checkout@v4

      - name: Run Plugin Check
        # Pinned to a specific release rather than @v1 so an upstream
        # regression can't silently change our gate.
        uses: wordpress/plugin-check-action@v1.1.6
        with:
          build-dir: ${{ github.workspace }}
          slug: isoft-fm-foundation
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          include-experimental: true
          exclude-directories: |
            vendor
            node_modules
            tests
            languages
