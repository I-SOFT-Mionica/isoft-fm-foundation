name: WPCS

on:
  push:
    branches: [main, "dev/0.12.x"]
  pull_request:
    branches: [main, "dev/0.12.x"]

jobs:
  phpcs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        # --graceful-warnings: cs2pr still emits ##[warning] annotations for
        # warning-severity issues, but exits 0 so the step only fails on real
        # errors. Without it, every alignment warning or discouraged-function
        # notice would turn into a red CI run.
        run: vendor/bin/phpcs --standard=phpcs.xml.dist -q --report=checkstyle | cs2pr --graceful-warnings
