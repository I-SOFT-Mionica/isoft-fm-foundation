name: Deploy to WordPress.org

# Manually push the current `main` (or whatever ref the workflow is run from)
# to the WordPress.org plugin SVN repo. Pushes go live publicly within
# ~15 minutes — that's why this is manual-trigger only, never on push.
#
# Prerequisites (one-time):
#   1. Generate an SVN "application password" at
#      https://profiles.wordpress.org/me/profile/edit/group/3/?screen=svn-password
#   2. Add two repo secrets (Settings → Secrets and variables → Actions):
#        SVN_USERNAME — your wp.org login (case-sensitive)
#        SVN_PASSWORD — the application password from step 1
#   3. Drop banner/icon/screenshot files into .wordpress-org/ (optional but
#      recommended; see .wordpress-org/README.md for sizes and names).
#
# Per release:
#   1. Bump Version: header + ISOFT_FMF_VERSION const + Stable tag on a PR.
#   2. Merge the PR to main.
#   3. Actions → Deploy to WordPress.org → Run workflow → enter the same
#      version number → Run.
#
# Under the hood: 10up/action-wordpress-plugin-deploy stages the repo into
# the SVN trunk (respecting .distignore), then `svn copy trunk tags/X.Y.Z`
# and `svn ci`. Assets in .wordpress-org/ go to SVN /assets/ separately.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (must match readme.txt Stable tag AND plugin Version: header)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — do everything except the final svn commit'
        type: boolean
        default: false

jobs:
  deploy:
    name: Push to WP.org SVN
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        # blocks/build/ is gitignored — without these two steps the
        # shipped zip has empty block folders (source excluded by
        # .distignore, compiled output never built) and every Gutenberg
        # block renders blank on user sites.
        run: npm ci

      - name: Build block bundles
        run: npm run build

      - name: Verify version consistency
        # The single biggest way to ship a broken release is mismatched
        # version metadata. readme.txt's Stable tag is what WP.org actually
        # serves from the SVN tags/ directory — if it doesn't match the
        # plugin header or the constant, users get a confused or stale plugin.
        run: |
          INPUT="${{ inputs.version }}"
          README=$(awk -F': *' '/^Stable tag:/ {print $2; exit}' readme.txt | tr -d '[:space:]')
          HEADER=$(awk -F': *' '/^ \* Version:/ {print $2; exit}' isoft-fm-foundation.php | tr -d '[:space:]')
          CONST=$(awk -F"'" '/^const ISOFT_FMF_VERSION/ {print $2; exit}' isoft-fm-foundation.php)

          printf 'Input version:    %s\nreadme Stable tag: %s\nPlugin Version:    %s\nVERSION constant:  %s\n' \
            "$INPUT" "$README" "$HEADER" "$CONST"

          fail=0
          [ "$INPUT" = "$README" ] || { echo "::error::Input version ($INPUT) ≠ readme.txt Stable tag ($README)"; fail=1; }
          [ "$INPUT" = "$HEADER" ] || { echo "::error::Input version ($INPUT) ≠ plugin Version: header ($HEADER)"; fail=1; }
          [ "$INPUT" = "$CONST" ]  || { echo "::error::Input version ($INPUT) ≠ ISOFT_FMF_VERSION constant ($CONST)"; fail=1; }
          exit $fail

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: isoft-fm-foundation
          VERSION: ${{ inputs.version }}
          ASSETS_DIR: .wordpress-org
          DRY_RUN: ${{ inputs.dry_run }}
